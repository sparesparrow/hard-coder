[tool.poetry]
name = "system-context-monitor"
version = "0.1.0"
description = "A comprehensive system monitoring solution with cognitive workflows"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "system_context_monitor"}]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.68.0"
uvicorn = "^0.15.0"
pydantic = "^1.8.2"
structlog = "^21.1.0"
prometheus-client = "^0.11.0"
asyncio = "^3.4.3"
python-socketio = "^5.4.0"
aiohttp = "^3.8.1"
pillow = "^8.3.1"
pyperclip = "^1.8.2"
psutil = "^5.8.0"
qrcode = "^7.3"
mss = "^9.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^6.2.5"
pytest-asyncio = "^0.15.1"
pytest-cov = "^2.12.1"
pytest-mock = "^3.6.1"
black = "^21.7b0"
isort = "^5.9.3"
mypy = "^0.910"
flake8 = "^3.9.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = """
    --verbose
    --capture=no
    --log-cli-level=INFO
    -s
    --tb=short
    --cov=core
    --cov=services
    --cov-report=term-missing
    --cov-report=html:test_coverage
"""
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pylint.messages_control]
disable = ["C0111", "C0103"]

[tool.pylint.format]
max-line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39" 